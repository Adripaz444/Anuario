<style>
body{font-family:Arial,sans-serif;text-align:center;padding:40px;}
input{padding:10px;width:300px;}
button{padding:10px 15px;}
#resultado{margin-top:20px;}

:root{
    --azul-principal:#4B5FD0;
    --azul-claro:#5E90C8;
    --celeste:#5CC3E0;
    --fondo:#F2F2F2;
    --blanco:#FFFFFF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--fondo);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* FIGURAS DECORATIVAS */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--azul-claro),var(--celeste));
    top:-200px;
    right:-150px;
    z-index:-1;
}

body::after{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:var(--azul-claro);
    bottom:-200px;
    left:-150px;
    z-index:-1;
}

/* CONTENEDOR */

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    padding-top:120px;
    text-align:center;
}

h1{
    color:var(--azul-principal);
    font-size:60px;
    margin-bottom:10px;
}

.subtitulo{
    color:#666;
    margin-bottom:40px;
}

/* BUSCADOR */

.buscador{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:40px;
    flex-wrap:wrap;
}

input{
    width:400px;
    max-width:90%;
    padding:15px;
    border:none;
    border-radius:30px;
    outline:none;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

button{
    padding:15px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(
        135deg,
        var(--azul-principal),
        var(--celeste)
    );
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* TARJETA */

.resultado{
    max-width:600px;
    margin:auto;
}

.card{
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-top:20px;
}

.card img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
}

.card h2{
    color:var(--azul-principal);
}

.card p{
    margin-top:10px;
    color:#555;
}
    .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 40px;

    position: relative;
    box-sizing: border-box;
}

/* LOGO */

.logo img {
    width: 130px;
    height: auto;
    display: block;
}
/* HEADER */
header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 50px;

    box-sizing: border-box;
}

/* LOGO */
.logo {
    width: 180px;
    height: auto;
}

/* BOTON ☰ */
.menu-btn {
    width: 60px;
    height: 50px;

    border: none;
    border-radius: 25px;

    background: #5b82b8;
    color: white;

    font-size: 25px;

    cursor: pointer;

    transition: 0.3s;
}

.menu-btn:hover {
    transform: scale(1.05);
}


/* ========================= */
/* MENU LATERAL DERECHO */
/* ========================= */

#menuLateral {
    position: fixed;

    top: 0;
    right: -320px;

    width: 280px;
    height: 100vh;

    background: white;

    display: flex;
    flex-direction: column;

    padding: 80px 25px 25px;

    box-sizing: border-box;

    box-shadow: -5px 0 20px rgba(0,0,0,0.2);

    transition: right 0.4s ease;

    z-index: 9999;
}


/* CUANDO EL MENU ESTA ABIERTO */

#menuLateral.activo {
    right: 0;
}


/* ENLACES */

#menuLateral a {
    text-decoration: none;

    color: #333;

    font-size: 17px;

    padding: 15px;

    border-bottom: 1px solid #ddd;

    transition: 0.3s;
}


#menuLateral a:hover {
    background: #e8eef7;

    color: #315f9c;
}


/* BOTON CERRAR */

.cerrar {
    position: absolute;

    top: 20px;
    right: 20px;

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 50%;

    background: #5b82b8;

    color: white;

    font-size: 22px;

    cursor: pointer;
}

function buscar(){
    const texto = document.getElementById("busqueda").value.toLowerCase().trim();
    const resultados = estudiantes.filter(e =>
        e.nombre.toLowerCase().includes(texto)
    );

    const div = document.getElementById("resultado");

    if(texto === ""){
        div.innerHTML = "<p>Escribe el nombre de un estudiante.</p>";
        return;
    }

    if(resultados.length === 0){
        div.innerHTML = "<p>No se encontró ningún estudiante.</p>";
        return;
    }

    div.innerHTML = resultados.map(e => `
        <div class="card">
            ${e.foto ? `<img src="${e.foto}" alt="Foto de ${e.nombre}" width="300" height="400">` : ""}
            <h2>${e.nombre}</h2>
            <p><strong>Grado:</strong> ${e.grado}</p>
        </div>
    `).join("");
}

    document.getElementById("menuLateral").classList.add("activo");

    document.getElementById("menuLateral").classList.remove("activo");
