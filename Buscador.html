<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Estudiantes</title>

<style>

:root{
    --azul-principal:#4B5FD0;
    --azul-claro:#5E90C8;
    --celeste:#5CC3E0;
    --fondo:#F2F2F2;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--fondo);
    min-height:100vh;
    overflow-x:hidden;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

.logo{
    width:120px;
    height:auto;
}

.menu-btn{
    font-size:30px;
    border:none;
    background:none;
    cursor:pointer;
}

/* MENU LATERAL */

#menuLateral{
    position:fixed;
    top:0;
    left:-300px;
    width:280px;
    height:100%;
    background:white;
    box-shadow:0 0 20px rgba(0,0,0,.2);
    transition:.3s;
    z-index:9999;
    overflow-y:auto;
}

#menuLateral a{
    display:block;
    padding:15px 20px;
    text-decoration:none;
    color:#333;
}

#menuLateral a:hover{
    background:#f0f0f0;
}

.cerrar{
    width:100%;
    padding:15px;
    border:none;
    background:#4B5FD0;
    color:white;
    font-size:20px;
    cursor:pointer;
}

/* SUBMENU */

.dropdown{
    position:relative;
}

.submenu{
    display:none;
    background:#f8f8f8;
}

.dropdown:hover .submenu{
    display:block;
}

.submenu a{
    padding-left:40px;
}

/* CONTENIDO */

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    text-align:center;
    padding-top:50px;
}

h1{
    color:var(--azul-principal);
    margin-bottom:30px;
}

.buscador{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

input{
    width:400px;
    max-width:90%;
    padding:15px;
    border:none;
    border-radius:30px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

button.buscar-btn{
    padding:15px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(
        135deg,
        var(--azul-principal),
        var(--celeste)
    );
    color:white;
    cursor:pointer;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
    color:#4B5FD0;
}

</style>
</head>
<body>

<header>

    <img src="logoipc.jpg" class="logo">

    <button class="menu-btn" onclick="abrirMenu()">
        ☰
    </button>

</header>

<nav id="menuLateral">

    <button class="cerrar" onclick="cerrarMenu()">
        ✕
    </button>

    <a href="index.html">Inicio</a>

    <a href="Historia.html">Historia del Colegio</a>

    <a href="Docentes.html">Docentes</a>

    <div class="dropdown">

        <a href="#">Estudiantes ▾</a>

        <div class="submenu">
            <a href="MatutinaE.html">🌞 Matutina</a>
            <a href="VespertinaE.html">🌙 Vespertina</a>
        </div>

    </div>

    <a href="Actividades.html">Actividades</a>
    <a href="Logros.html">Logros</a>
    <a href="Recuerdos.html">Recuerdos</a>
    <a href="Buscador.html">🔍 Buscar</a>
    <a href="Creditos.html">Créditos</a>

</nav>

<div class="container">

    <h1>Buscador de Estudiantes</h1>

    <div class="buscador">

        <input
            type="text"
            id="busqueda"
            placeholder="Escribe un nombre"
        >

        <button
            class="buscar-btn"
            onclick="buscar()"
        >
            Buscar
        </button>

    </div>

    <div id="resultado"></div>

</div>

<script>

const estudiantes = [

    {
        nombre:"Anderson Abraham Mazariegos López",
        grado:"5BCA"
    },

    {
        nombre:"José Francisco González",
        grado:"5BCA"
    },

    {
        nombre:"Estefani Dayana Alvizures",
        grado:"1ro B"
    }

];

function buscar(){

    const texto = document
        .getElementById("busqueda")
        .value
        .toLowerCase()
        .trim();

    const resultado =
        estudiantes.filter(estudiante =>
            estudiante.nombre
            .toLowerCase()
            .includes(texto)
        );

    const div =
        document.getElementById("resultado");

    if(resultado.length === 0){

        div.innerHTML =
        "<p>No se encontró ningún estudiante.</p>";

        return;
    }

    div.innerHTML = resultado.map(estudiante =>

        `<div class="card">

            <h2>${estudiante.nombre}</h2>

            <p>
                Grado:
                ${estudiante.grado}
            </p>

        </div>`

    ).join("");

}

document
.getElementById("busqueda")
.addEventListener("keyup", function(event){

    if(event.key === "Enter"){
        buscar();
    }

});

function abrirMenu(){
    document.getElementById("menuLateral").style.left = "0";
}

function cerrarMenu(){
    document.getElementById("menuLateral").style.left = "-300px";
}

</script>

</body>
</html>
