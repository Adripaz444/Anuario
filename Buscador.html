<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador IPC 2026</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    text-align:center;
    padding:40px;
}

h1{
    color:#4B5FD0;
}

input{
    width:350px;
    padding:12px;
    border:none;
    border-radius:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
    padding:12px 20px;
    border:none;
    border-radius:25px;
    background:#4B5FD0;
    color:white;
    cursor:pointer;
}

.card{
    background:white;
    max-width:500px;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
    width:250px;
    height:320px;
    object-fit:cover;
    border-radius:15px;
}
</style>
</head>
<body>

<h1>Buscador de Estudiantes IPC 2026</h1>

<input type="text" id="busqueda" placeholder="Buscar estudiante">
<button onclick="buscar()">Buscar</button>

<div id="resultado"></div>

<script>

/* PEGA AQUÍ TU LISTA COMPLETA */
const estudiantes = [
    
];

function obtenerCarpeta(grado){

    const carpetas = {
        "1roA":"1roa",
        "1ro A":"1roa",
        "1ro B":"1rob",
        "2do A":"2doa",
        "2do B":"2dob",
        "Tercero A":"3roa",
        "Tercero B":"3rob",
        "4to Bach A":"4toBachA",
        "4to Bach B":"4toBachB",
        "4to Diseño":"4toDiseno",
        "4A":"4a",
        "4C":"4c",
        "4S":"4s",
        "5A":"5a",
        "5C":"5c",
        "5S":"5s",
        "5BCA":"5bca",
        "5BCB":"5bcb",
        "5BD":"5bd",
        "6A":"6a",
        "6C":"6c",
        "6S":"6s"
    };

    return carpetas[grado] || "";
}

function buscar(){

    const texto =
    document.getElementById("busqueda")
    .value
    .toLowerCase();

    const resultados =
    estudiantes.filter(e =>
        e.nombre.toLowerCase().includes(texto)
    );

    const div =
    document.getElementById("resultado");

    if(resultados.length===0){

        div.innerHTML=`
        <div class="card">
            <h2>No encontrado</h2>
        </div>
        `;

        return;
    }

    div.innerHTML = resultados.map(e => {

        const ruta =
        `Matutina/${obtenerCarpeta(e.grado)}/${e.nombre}.jpg`;

        return `
        <div class="card">

            <img src="${ruta}"
                 alt="${e.nombre}"
                 onerror="this.src='sin-foto.jpg'">

            <h2>${e.nombre}</h2>

            <p><strong>Grado:</strong> ${e.grado}</p>

        </div>
        `;

    }).join("");
}
</script>

</body>
</html>
