<title>Buscador de Estudiantes</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;padding:40px;}
input{padding:10px;width:300px;}
button{padding:10px 15px;}
#resultado{margin-top:20px;}

:root{
    --azul-principal:#4B5FD0;
    --azul-claro:#5E90C8;
    --celeste:#5CC3E0;
    --fondo:#F2F2F2;
    --blanco:#FFFFFF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--fondo);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* FIGURAS DECORATIVAS */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--azul-claro),var(--celeste));
    top:-200px;
    right:-150px;
    z-index:-1;
}

body::after{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:var(--azul-claro);
    bottom:-200px;
    left:-150px;
    z-index:-1;
}

/* CONTENEDOR */

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    padding-top:120px;
    text-align:center;
}

h1{
    color:var(--azul-principal);
    font-size:60px;
    margin-bottom:10px;
}

.subtitulo{
    color:#666;
    margin-bottom:40px;
}

/* BUSCADOR */

.buscador{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:40px;
    flex-wrap:wrap;
}

input{
    width:400px;
    max-width:90%;
    padding:15px;
    border:none;
    border-radius:30px;
    outline:none;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

button{
    padding:15px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(
        135deg,
        var(--azul-principal),
        var(--celeste)
    );
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* TARJETA */

.resultado{
    max-width:600px;
    margin:auto;
}

.card{
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-top:20px;
}

.card img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
}

.card h2{
    color:var(--azul-principal);
}

.card p{
    margin-top:10px;
    color:#555;
}
    .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 40px;

    position: relative;
    box-sizing: border-box;
}

/* LOGO */

.logo img {
    width: 130px;
    height: auto;
    display: block;
}

/* BOTON DEL MENU */

.menu-toggle {
    background: #4f73b8;
    color: white;

    border: none;
    border-radius: 12px;

    width: 60px;
    height: 50px;

    font-size: 25px;
    cursor: pointer;

    margin-left: auto;
}

/* MENU OCULTO */

.navbar {
    display: none;

    position: absolute;

    top: 100%;
    right: 40px;

    width: 250px;

    background: white;

    border-radius: 15px;

    padding: 15px;

    box-shadow: 0 10px 25px rgba(0,0,0,0.15);

    z-index: 1000;
}

/* CUANDO EL MENU ESTA ABIERTO */

.navbar.active {
    display: flex;
    flex-direction: column;
}

/* ENLACES */

.navbar a {
    text-decoration: none;
    color: #333;

    padding: 12px;

    border-radius: 8px;

    transition: 0.3s;
}

.navbar a:hover {
    background: #e9eef9;
}

/* DROPDOWN */

.dropdown {
    width: 100%;
}

.dropdown-btn {
    width: 100%;

    border: none;
    background: transparent;

    padding: 12px;

    text-align: left;

    font-size: 16px;

    cursor: pointer;
}

/* OPCIONES OCULTAS */

.dropdown-content {
    display: none;

    flex-direction: column;

    padding-left: 15px;
}

/* MOSTRAR OPCIONES */

.dropdown.active .dropdown-content {
    display: flex;
}

</style>

function buscar(){
    const texto = document.getElementById("busqueda").value.toLowerCase();
    const resultados = estudiantes.filter(e =>
        e.nombre.toLowerCase().includes(texto)
    );

    const div = document.getElementById("resultado");

    if(resultados.length === 0){
        div.innerHTML = "<p>No se encontró ningún estudiante.</p>";
        return;
    }

    div.innerHTML = resultados.map(e =>
        `<h3>${e.nombre}</h3><p>Grado: ${e.grado}</p><hr>`
    ).join("");
}
